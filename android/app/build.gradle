plugins {
    id "com.android.application"
}

android {
    namespace "app.rfflasher.android"
    compileSdk 35

    defaultConfig {
        applicationId "app.rfflasher.android"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "0.1.1"
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // sign with your own key for a release build; the debug build is ready to sideload
        }
    }

    // the bundled site is already compressed where it matters (PNG, zip); keep the rest compressed in the APK
    androidResources { ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~" }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
